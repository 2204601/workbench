[package]
name = "pdf-one"
version = "0.2.1"
description = "PDF を見る・ページを整理する・書き込む・フォームに入力する"
authors = ["2204601"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name, which clash
# on Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "pdf_one_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
lopdf = { version = "0.45", default-features = false }
subsetter = "0.2"
skrifa = "0.48"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"

[profile.release]
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }

[target."cfg(target_os = \"macos\")".dependencies]
core-foundation-sys = "0.8"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
