[package]
name = "disk-analyzer"
version = "0.2.0"
description = "フォルダやドライブの中で、何が容量を使っているかをグラフで見る"
authors = ["2204601"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name, which clash
# on Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "disk_analyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# Sub-folders are read in parallel (scan.rs): a network share answers each
# folder slowly, so many at once is much faster than one by one.
rayon = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# The window opens at the size and place it had when last closed.
tauri-plugin-window-state = "2"
# A second launch brings up the running app's window instead (lib.rs).
tauri-plugin-single-instance = "2"
# Warnings and errors into a file in the app's log folder (lib.rs, src/lib/log.ts).
tauri-plugin-log = "2"
# OS notifications for long scans that end while the user is away (src/lib/osNotify.ts).
tauri-plugin-notification = "2"

# Platform Distribution §7. Measured on stockroom: thin LTO rebuilds 2.5x
# faster than fat LTO + 1 unit, for about +0.5 MB in the installer.
[profile.release]
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

# Drives and their free space (drives.rs), network shares (volume.rs), and
# the system proxy (proxy.rs).
[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem"] }

# System proxy lookup (PAC) for the updater, see proxy.rs.
[target."cfg(target_os = \"macos\")".dependencies]
core-foundation-sys = "0.8"

# statfs / statvfs (drives.rs, volume.rs).
[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# The mock runtime: commands called through IPC as the frontend calls them (tests/ipc.rs).
tauri = { version = "2", features = ["test"] }
