<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Clip</title>
    <script type="module" src="/src/popup.ts" defer></script>
  </head>
  <body class="popup">
    <header class="search">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" /><path d="M10.5 10.5 14 14" /></svg>
      <input id="query" type="text" placeholder="スニペットと履歴を検索" autocomplete="off" spellcheck="false" />
      <button id="manage" class="icon-btn" title="スニペットと設定">
        <svg viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 11.5h11" /><circle cx="10" cy="4.5" r="1.6" class="knob" /><circle cx="6" cy="11.5" r="1.6" class="knob" /></svg>
      </button>
    </header>

    <div id="notice" class="notice" hidden>
      <p>
        自動で入力するには、アクセシビリティの許可が必要です。いまは選ぶとコピーされるので、<kbd>⌘V</kbd> で貼り付けてください。
      </p>
      <button id="allow" class="button">許可する…</button>
    </div>

    <main id="list-wrap">
      <ul id="list"></ul>
      <div id="empty" class="empty" hidden></div>
    </main>

    <div id="preview" class="preview"></div>
    <footer id="hints" class="hints"></footer>
  </body>
</html>
