[package]
name = "shelf"
version = "0.1.7"
description = "A tiny drop shelf for moving files around"
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows.
name = "shelf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "macos-private-api", "image-png"] }
tauri-plugin-drag = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# In-app updates (update.rs): the check, and the dialogs that offer it.
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
# Launch at login, and the show / hide shortcut (lib.rs).
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
# A second launch (by hand while the login item already runs) only brings up
# the shelf, instead of a second tray icon fighting over the shortcut.
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSPasteboard", "NSPasteboardItem", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString", "NSURL"] }
# System proxy lookup (PAC) for the updater, see proxy.rs.
core-foundation-sys = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# System proxy lookup (WinHTTP, PAC) for the updater, see proxy.rs.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }
