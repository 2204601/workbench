name: video-studio

on:
  # Work branches are checked through their pull request; pushing to them
  # again would only run the same jobs twice. main still runs, as its cache
  # is the one later runs restore.
  push:
    branches: ["main"]
    # Pushing a tag like video-studio-v0.1.0 builds and publishes a GitHub Release.
    # (Path filters are not applied to tag pushes.)
    tags: ["video-studio-v*"]
    paths: ["video-studio/**", ".github/workflows/video-studio.yml"]
  pull_request:
    paths: ["video-studio/**", ".github/workflows/video-studio.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release for the version in tauri.conf.json (creates the video-studio-v<version> tag)
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a branch supersedes its running build; releases always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    working-directory: video-studio

jobs:
  # Platform Governance §4: every gate but the installers, on Linux (cheap).
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2.9.2
        with:
          workspaces: video-studio/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux deps for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video-studio/package-lock.json
      - run: npm ci
      # The sidecar (tauri.conf.json bundle.externalBin): tauri-build wants it,
      # and the IPC tests export with it.
      - run: npm run ffmpeg
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npx vitest run
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      # tauri::generate_context! needs the built frontend folder to exist.
      - run: mkdir -p dist
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # Rust tests on Windows too: ffmpeg is started without a console window and
  # given Windows paths (spaces, backslashes), and the export test runs the
  # Windows ffmpeg that is shipped.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/fetch-ffmpeg.mjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2.9.2
        with:
          workspaces: video-studio/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mkdir dist
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only.
          - os: macos-latest
            rust-targets: aarch64-apple-darwin
            build-args: --target aarch64-apple-darwin
            target-triple: aarch64-apple-darwin
          - os: windows-latest
            rust-targets: ""
            build-args: ""
            target-triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      # Signs the in-app update files (Video Studio.app.tar.gz / -setup.exe .sig).
      # The matching public key is plugins.updater.pubkey in tauri.conf.json;
      # the key is the repository's, shared with Shelf and Renamer.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # GitHub Actions sets CI=true, and then the bundler skips the AppleScript
      # that lays out the .dmg window.
      TAURI_BUNDLER_DMG_IGNORE_CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video-studio/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2.9.2
        with:
          workspaces: video-studio/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npm run ffmpeg -- ${{ matrix.target-triple }}
      - name: Build
        shell: bash
        run: |
          # Without the key (pull requests from forks, or before the secret is
          # set) only the installers are built; a release then fails below for
          # want of the update files.
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/no-updater.json"
            no_updater=(--config "$RUNNER_TEMP/no-updater.json")
          fi
          npm run tauri build -- ${{ matrix.build-args }} "${no_updater[@]}"
      - uses: actions/upload-artifact@v6
        with:
          name: video-studio-${{ runner.os }}
          path: |
            video-studio/src-tauri/target/**/release/bundle/dmg/*.dmg
            video-studio/src-tauri/target/**/release/bundle/macos/*.tar.gz
            video-studio/src-tauri/target/**/release/bundle/macos/*.sig
            video-studio/src-tauri/target/**/release/bundle/nsis/*.exe
            video-studio/src-tauri/target/**/release/bundle/nsis/*.sig
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/video-studio-v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [test, test-windows, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5

      - name: Resolve tag, check version and extract notes
        id: meta
        run: |
          version="$(jq -r .version video-studio/src-tauri/tauri.conf.json)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            if [ "$tag" != "video-studio-v$version" ]; then
              echo "::error::Tag $tag does not match tauri.conf.json version $version"
              exit 1
            fi
          else
            # Manual run: the release step creates the tag on this commit.
            tag="video-studio-v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::Tag $tag already exists; bump the version before releasing again"
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          awk -v v="$version" '$0 ~ "^## " { f = ($2 == v); next } f' video-studio/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No '## $version' section in video-studio/CHANGELOG.md"
            exit 1
          fi

      - uses: actions/download-artifact@v7
        with:
          path: bundles
          merge-multiple: true

      # The product name has a space ("Video Studio.app.tar.gz"), which
      # GitHub turns into a dot when uploading; latest.json would then point
      # at a file that isn't there. Underscores instead, in every file name
      # ("Video_Studio_0.1.0_x64-setup.exe", as CHANGELOG.md names them).
      - name: Take the spaces out of file names
        run: |
          find bundles -type f -name '* *' | while IFS= read -r f; do
            base="$(basename "$f")"
            mv "$f" "$(dirname "$f")/${base// /_}"
          done
          find bundles -type f

      - name: Write latest.json for the in-app updater
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          shopt -s globstar nullglob
          app=(bundles/**/Video_Studio.app.tar.gz)
          exe=(bundles/**/*-setup.exe)
          if [ ! -f "${app[0]}.sig" ] || [ ! -f "${exe[0]}.sig" ]; then
            echo "::error::Update files are missing; set the TAURI_SIGNING_PRIVATE_KEY secret (see video-studio/README.md)"
            exit 1
          fi
          # The update dialog shows the changes, not the download / notice parts.
          awk '/^### ダウンロード/ { exit } 1' notes.md | sed -e 's/\*\*//g' -e 's/^### //' > update-notes.md
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          jq -n \
            --arg version "$VERSION" \
            --rawfile notes update-notes.md \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile mac_sig "${app[0]}.sig" \
            --arg mac_url "$base/$(basename "${app[0]}")" \
            --rawfile win_sig "${exe[0]}.sig" \
            --arg win_url "$base/$(basename "${exe[0]}")" \
            '{
              version: $version,
              notes: ($notes | rtrimstr("\n")),
              pub_date: $date,
              platforms: {
                "darwin-aarch64": { signature: ($mac_sig | rtrimstr("\n")), url: $mac_url },
                "windows-x86_64": { signature: ($win_sig | rtrimstr("\n")), url: $win_url }
              }
            }' > latest.json
          cat latest.json

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Video Studio v${{ steps.meta.outputs.version }}
          body_path: notes.md
          # Only what people download and what latest.json points to. The
          # .sig contents are already inside latest.json, and the apps read
          # latest.json from the fixed release below, not from here.
          files: |
            bundles/**/*.dmg
            bundles/**/*.exe
            bundles/**/*.tar.gz
          fail_on_unmatched_files: true

      # The installed apps read latest.json from this fixed release
      # (plugins.updater.endpoints in tauri.conf.json). Other tools release
      # from this repository too, so releases/latest can't be used. Runs after
      # the release above, so the files it points to are already there.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: video-studio-updater
          target_commitish: ${{ github.sha }}
          name: Video Studio アプリ内アップデート用
          body: |
            インストール済みの Video Studio が新しい版を確認するための `latest.json` を置いています（中身は最新の Video Studio の版を指します）。
            ダウンロードは各バージョンのリリース（Video Studio v…）からどうぞ。
          prerelease: true
          make_latest: false
          files: latest.json
          fail_on_unmatched_files: true
