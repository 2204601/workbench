name: shelf

on:
  push:
    branches: ["**"]
    # Pushing a tag like shelf-v0.1.0 builds and publishes a GitHub Release.
    # (Path filters are not applied to tag pushes.)
    tags: ["shelf-v*"]
    paths: ["shelf/**", ".github/workflows/shelf.yml"]
  pull_request:
    paths: ["shelf/**", ".github/workflows/shelf.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release for the version in tauri.conf.json (creates the shelf-v<version> tag)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            build-args: --target universal-apple-darwin
          - os: windows-latest
            rust-targets: ""
            build-args: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: shelf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shelf/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: shelf/src-tauri -> target

      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- ${{ matrix.build-args }}

      - uses: actions/upload-artifact@v4
        with:
          name: shelf-${{ runner.os }}
          path: |
            shelf/src-tauri/target/**/release/bundle/dmg/*.dmg
            shelf/src-tauri/target/**/release/bundle/msi/*.msi
            shelf/src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/shelf-v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag, check version and extract notes
        id: meta
        run: |
          version="$(jq -r .version shelf/src-tauri/tauri.conf.json)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            if [ "$tag" != "shelf-v$version" ]; then
              echo "::error::Tag $tag does not match tauri.conf.json version $version"
              exit 1
            fi
          else
            # Manual run: the release step creates the tag on this commit.
            tag="shelf-v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::Tag $tag already exists; bump the version before releasing again"
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          awk -v v="$version" '$0 ~ "^## " { f = ($2 == v); next } f' shelf/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No '## $version' section in shelf/CHANGELOG.md"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Shelf ${{ steps.meta.outputs.tag }}
          body_path: notes.md
          files: |
            bundles/**/*.dmg
            bundles/**/*.msi
            bundles/**/*.exe
          fail_on_unmatched_files: true
