name: shelf

on:
  push:
    paths: ["shelf/**", ".github/workflows/shelf.yml"]
  pull_request:
    paths: ["shelf/**", ".github/workflows/shelf.yml"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            build-args: --target universal-apple-darwin
          - os: windows-latest
            rust-targets: ""
            build-args: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: shelf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shelf/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: shelf/src-tauri -> target

      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- ${{ matrix.build-args }}

      - uses: actions/upload-artifact@v4
        with:
          name: shelf-${{ runner.os }}
          path: |
            shelf/src-tauri/target/**/release/bundle/dmg/*.dmg
            shelf/src-tauri/target/**/release/bundle/msi/*.msi
            shelf/src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error
