name: shelf

on:
  push:
    branches: ["**"]
    # Pushing a tag like shelf-v0.1.0 builds and publishes a GitHub Release.
    # (Path filters are not applied to tag pushes.)
    tags: ["shelf-v*"]
    paths: ["shelf/**", ".github/workflows/shelf.yml"]
  pull_request:
    paths: ["shelf/**", ".github/workflows/shelf.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release for the version in tauri.conf.json (creates the shelf-v<version> tag)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only.
          - os: macos-latest
            rust-targets: aarch64-apple-darwin
            build-args: --target aarch64-apple-darwin
          - os: windows-latest
            rust-targets: ""
            build-args: ""
    runs-on: ${{ matrix.os }}
    env:
      # Signs the in-app update files (Shelf.app.tar.gz / -setup.exe .sig). The
      # matching public key is plugins.updater.pubkey in tauri.conf.json.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # GitHub Actions sets CI=true, and then the bundler skips the AppleScript
      # that lays out the .dmg window (large icons, app on the left and the
      # Applications link on the right). tauri-action, which image-library
      # uses, sets this by default.
      TAURI_BUNDLER_DMG_IGNORE_CI: "true"
    defaults:
      run:
        working-directory: shelf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shelf/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: shelf/src-tauri -> target

      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build
        shell: bash
        run: |
          # Without the key (pull requests from forks, or before the secret is
          # set) only the installers are built; a release then fails below for
          # want of the update files.
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/no-updater.json"
            no_updater=(--config "$RUNNER_TEMP/no-updater.json")
          fi
          npm run tauri build -- ${{ matrix.build-args }} "${no_updater[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: shelf-${{ runner.os }}
          path: |
            shelf/src-tauri/target/**/release/bundle/dmg/*.dmg
            shelf/src-tauri/target/**/release/bundle/macos/*.tar.gz
            shelf/src-tauri/target/**/release/bundle/macos/*.sig
            shelf/src-tauri/target/**/release/bundle/nsis/*.exe
            shelf/src-tauri/target/**/release/bundle/nsis/*.sig
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/shelf-v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag, check version and extract notes
        id: meta
        run: |
          version="$(jq -r .version shelf/src-tauri/tauri.conf.json)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            if [ "$tag" != "shelf-v$version" ]; then
              echo "::error::Tag $tag does not match tauri.conf.json version $version"
              exit 1
            fi
          else
            # Manual run: the release step creates the tag on this commit.
            tag="shelf-v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::Tag $tag already exists; bump the version before releasing again"
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          awk -v v="$version" '$0 ~ "^## " { f = ($2 == v); next } f' shelf/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No '## $version' section in shelf/CHANGELOG.md"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: Write latest.json for the in-app updater
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          shopt -s globstar nullglob
          app=(bundles/**/Shelf.app.tar.gz)
          exe=(bundles/**/*-setup.exe)
          if [ ! -f "${app[0]}.sig" ] || [ ! -f "${exe[0]}.sig" ]; then
            echo "::error::Update files are missing; set the TAURI_SIGNING_PRIVATE_KEY secret (see shelf/README.md)"
            exit 1
          fi
          # The update dialog shows the changes, not the download / notice parts.
          awk '/^### ダウンロード/ { exit } 1' notes.md | sed -e 's/\*\*//g' -e 's/^### //' > update-notes.md
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          jq -n \
            --arg version "$VERSION" \
            --rawfile notes update-notes.md \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile mac_sig "${app[0]}.sig" \
            --arg mac_url "$base/$(basename "${app[0]}")" \
            --rawfile win_sig "${exe[0]}.sig" \
            --arg win_url "$base/$(basename "${exe[0]}")" \
            '{
              version: $version,
              notes: ($notes | rtrimstr("\n")),
              pub_date: $date,
              platforms: {
                "darwin-aarch64": { signature: ($mac_sig | rtrimstr("\n")), url: $mac_url },
                "windows-x86_64": { signature: ($win_sig | rtrimstr("\n")), url: $win_url }
              }
            }' > latest.json
          cat latest.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Shelf v${{ steps.meta.outputs.version }}
          body_path: notes.md
          files: |
            bundles/**/*.dmg
            bundles/**/*.exe
            bundles/**/*.tar.gz
            bundles/**/*.sig
            latest.json
          fail_on_unmatched_files: true

      # The installed apps read latest.json from this fixed release
      # (plugins.updater.endpoints in tauri.conf.json). Other tools release
      # from this repository too, so releases/latest can't be used. Runs after
      # the release above, so the files it points to are already there.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: shelf-updater
          target_commitish: ${{ github.sha }}
          name: Shelf アプリ内アップデート用
          body: |
            インストール済みの Shelf が新しい版を確認するための `latest.json` を置いています（中身は最新の Shelf の版を指します）。
            ダウンロードは各バージョンのリリース（Shelf v…）からどうぞ。
          prerelease: true
          make_latest: false
          files: latest.json
          fail_on_unmatched_files: true
