name: shelf

on:
  push:
    branches: ["**"]
    # Pushing a tag like shelf-v0.1.0 builds and publishes a GitHub Release.
    # (Path filters are not applied to tag pushes.)
    tags: ["shelf-v*"]
    paths: ["shelf/**", ".github/workflows/shelf.yml"]
  pull_request:
    paths: ["shelf/**", ".github/workflows/shelf.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            build-args: --target universal-apple-darwin
          - os: windows-latest
            rust-targets: ""
            build-args: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: shelf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shelf/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: shelf/src-tauri -> target

      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- ${{ matrix.build-args }}

      - uses: actions/upload-artifact@v4
        with:
          name: shelf-${{ runner.os }}
          path: |
            shelf/src-tauri/target/**/release/bundle/dmg/*.dmg
            shelf/src-tauri/target/**/release/bundle/msi/*.msi
            shelf/src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/shelf-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version and extract notes
        run: |
          version="${GITHUB_REF_NAME#shelf-v}"
          app_version="$(jq -r .version shelf/src-tauri/tauri.conf.json)"
          if [ "$version" != "$app_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $app_version"
            exit 1
          fi
          awk -v v="$version" '$0 ~ "^## " { f = ($2 == v); next } f' shelf/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No '## $version' section in shelf/CHANGELOG.md"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Shelf ${{ github.ref_name }}
          body_path: notes.md
          files: |
            bundles/**/*.dmg
            bundles/**/*.msi
            bundles/**/*.exe
          fail_on_unmatched_files: true
